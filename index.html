            <input type="text" class="filter-by-text">

        <section class="upload-img-container">
            <!-- <label> -->

        <section class="imgs-container"></section>

    <section class="meme-editor">
        <section class="canvas-container">
            <canvas width="400" height="400" onmousedown="onDown(event)" onmousemove="onMove(event)"
                onmouseup="onUp()" ontouchstart="onDown(event)" ontouchmove="onMove(event)"
                ontouchend="onUp()">
            </canvas>
        </section>

        <section class="meme-editor-panel">

            </section>

            <section class="font-editor-panel">
                <input type="text" class="line-text" oninput="onSetLineText(this.value)">

                <label class="font-size">
                    <span>A+-</span>
                    <input type="number" class="line-font-size" min="1" max="100"
                        oninput="onSetLineSize(+this.value)">
                </label>

                <input type="color" class="line-color" onchange="onSetLineColor(this.value)">

            </section>
        </section>

        <section class="download-save-container">
            <a href="#" class="btn btn-primary" onclick="onDownloadMeme(this)"
                download="my-meme">Download</a>

            <button class="btn btn-primary" onclick="onSaveMeme()">Save Meme</button>
        </section>

        <section class="upload-container">
            <form action="" method="POST" enctype="multipart/form-data"
                onsubmit="onUploadMeme(event)">
                <input name="img" id="imgData" type="hidden">
                <button class="btn btn-primary" type="submit">Upload to Cloud</button>
            </form>

            <section class="share-container"></section>
        </section>
    </section>
